<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJB — prova locale Wan</title><style>body{background:#100d10;color:#e8dfc8;font:16px Georgia;max-width:800px;margin:35px auto;padding:20px}section{border:1px solid #c99845;border-radius:12px;padding:20px;margin:20px 0}button,select,input,textarea{font:inherit;margin:8px 0;padding:10px;max-width:100%;box-sizing:border-box}button{background:#c99845;cursor:pointer;border-radius:6px}textarea{width:100%;height:135px}#msg{white-space:pre-wrap}</style><h1>DJB — prima scena video</h1><p>Questa pagina prepara i file sul PC. Non invia richieste e non avvia la GPU.</p><section><h2>1. Crea il JSON di prova</h2><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><textarea id="prompt">The same woman as the reference image, preserving her facial features and hairstyle, in a dark gothic atmosphere. She gently turns her head. Static camera, subtle natural movement, cinematic lighting, no text.</textarea><label>Risoluzione <select id="resolution"><option>480p</option><option>720p</option></select></label><br><button id="make">Scarica JSON di prova</button></section><section><h2>2. Recupera il video completato</h2><p>Seleziona la risposta JSON completa del job COMPLETED.</p><input id="result" type="file" accept=".json,application/json"><br><button id="save">Scarica MP4</button></section><p id="msg" role="status"></p><script>
const el=id=>document.getElementById(id);function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
el('make').onclick=async()=>{try{const f=el('image').files[0],p=el('prompt').value.trim();if(!f||f.size>4*1024*1024)throw Error('Scegli un’immagine da massimo 4 MiB.');if(p.length<10||p.length>3000)throw Error('Descrizione da 10 a 3000 caratteri.');const bytes=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));download(new Blob([JSON.stringify({input:{action:'generate_scene',image_base64:btoa(s),prompt:p,resolution:el('resolution').value,frames:81,steps:40,seed:42}},null,2)],{type:'application/json'}),'test-input.json');el('msg').textContent='JSON creato. Esegui un solo job dal pannello RunPod.'}catch(e){el('msg').textContent=e.message}};
el('save').onclick=async()=>{try{const f=el('result').files[0];if(!f||f.size>12*1024*1024)throw Error('Scegli il JSON completo della risposta, massimo 12 MiB.');const r=JSON.parse(await f.text()),o=r.output||r;if(!o.success||typeof o.video_base64!=='string')throw Error('Questa risposta non contiene un video completato.');const s=atob(o.video_base64),b=Uint8Array.from(s,c=>c.charCodeAt(0));if(b.length!==o.bytes)throw Error('Risposta incompleta: numero di byte diverso.');download(new Blob([b],{type:'video/mp4'}),'djb-video-test.mp4');el('msg').textContent='MP4 recuperato. Tempo nell’handler: '+o.worker_seconds+' secondi (non durata totale fatturata).'}catch(e){el('msg').textContent=e.message}};
</script></html>
